<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Iframe</title>
</head>
<body>
    <h1>Testando o uso do Iframe</h1>
    <p>
        Acessando o site do 
        <!-- Padrão do Iframe 300x150 -->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="no">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a>
        </iframe> 
        para aprender a programar.
    </p>

    <p>
        O site do <iframe src="https://www.google.com.br" frameborder="0"></iframe> também é bem legal. Pena que não funciona dentro do iframe.
    </p>
    <p>
        O site do Pedro 
        <iframe src="https://cachebe-dev.github.io/estudo-html-css/estudos-css/atividade-1/index.html" frameborder="0" height="500" width="500">
            <a href="https://cachebe-dev.github.io/estudo-html-css/estudos-css/atividade-1/index.html">Repositório do Pedro</a>
        </iframe> também é bem legal.
    </p>
</body>
</html>
