<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização de elementos empacotados</title>
    <style>
        /* 
            order: "0 0 4 9" ordem dos elementos dentro do container
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background-color: blue;
        }

        .container {
            position: relative;
            height: 500px;
            background-color: white;
            padding: 40px 20px;
            border-radius: 20px;
            display: flex;
            flex-flow: row wrap;
            align-content: space-evenly;
            justify-content: center;
        }
        .item {
            
            background-color: lightskyblue;
            border: 1px solid black;
            padding: 30px;
            margin: 0px 2px 10px 0px;
            border-radius: 20px;
            text-align: center;
            
        }
        #item-3 {
            order: -2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item" id="item-3">C</div>
        <div class="item" style="order:-1;">D</div>
        <div class="item">E</div>
        <div class="item" style="order:1;">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
