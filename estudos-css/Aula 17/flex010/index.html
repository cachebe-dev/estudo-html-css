<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização de elementos empacotados</title>
    <style>
        /* 
            flex-shrink: diminui os elementos dentro do container.
            flex-grow: aumenta os elementos dentro do container.
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 600;
            font-size: 1.1em;
        }
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: blue;
        }

        .container {
            width: 800px;
            height: 300px;
            background-color: white;
            padding: 40px 20px;
            border-radius: 20px;
            display: flex;
            flex-flow: row wrap;
            align-items: center;
            align-content: space-evenly;
            justify-content: center;
            
        }
        .item {
            background-color: white;
            border: 6px dashed rgb(255, 166, 0);
            padding: 30px;
            margin: 0px 10px 10px 0px;
            border-radius: 20px;
            text-align: center;
            flex-shrink: 1;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
