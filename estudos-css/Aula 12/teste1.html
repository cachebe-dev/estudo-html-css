<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste</title>
    <style>
        .card {
            position: relative;
            background-color: red;
            width: 400px;
            height: 400px;
            border: 2px solid black;
            border-radius: 5px;
        }
        .content {
            position: absolute;
            background-color: white;
            width: 300px;  
            height: 300px;
            border: 2px solid black;
            border-radius: 5px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }        
        .text {
            color: black;
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
            font-weight: 600;
            font-style: italic;
            text-align: justify;
            padding: 30px;
        }
        h1 {
            text-align: center;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="content">
            <div class="text">
                <h1>Teste</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Corporis explicabo, illo ipsam delectus eveniet qui! Fuga possimus eaque, reiciendis non maxime praesentium inventore voluptatibus numquam iusto totam, nisi doloribus! Harum.</p>
            </div>
        </div>
    </div>
</body>
</html>
