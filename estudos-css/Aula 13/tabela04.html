<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 400px;
        }
        td, th {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
        }
        .c-nome {
            background-color: lightgreen;
        }
        .c-group {
            background-color: yellow;
        }
        .c-teste {
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>
    <table>
        <colgroup>
            <col class="c-nome">
            <col class="c-group" span="2">
            <col class="c-profissao">
            <col class="c-teste">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
            <th scope="col">Teste</th>
        </tr>
        <tr>
            <td>Isabela</td>
            <td>F</td>
            <td>20</td>
            <td>Coordenadora</td>
        </tr>
        <tr>
            <td>Pedro</td>
            <td>M</td>
            <td>22</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Solange</td>
            <td>F</td>
            <td>53</td>
            <td>Vendedora</td>
        </tr>
        <tr>
            <td>Adilson</td>
            <td>M</td>
            <td>59</td>
            <td>Vendedor</td>
        </tr>
        <tr>
            <td>Arthur</td>
            <td>M</td>
            <td>27</td>
            <td>Groomer</td>
        </tr>                                
    </table>
</body>
</html>
