<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 3</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        caption {
            padding-bottom: 30px;
            font-weight: bold;
            font-size: 2.5em;
        }
        table {
            border-collapse: collapse;
        }
        thead {
            background-color: black;
            font-weight: bold;
            color: white;
        }
        td {
            border: 1px solid black;
            padding: 10px;
            width: 200px;
            text-align: center;
            vertical-align: middle;
        }

        .col-bolder {
            font-weight: bold;
            background-color: black;
            color: white;
        }
        tbody > tr:nth-child(odd) {
            background-color: rgb(218, 218, 218);
        }
    </style>
</head>
<body>
    <table>
        <caption>Tabela de Filmes</caption>
        <thead>
            <th>
                <tr>
                    <td>Grupo</td>
                    <td>Nomes</td>
                    <td scope="colgroup" colspan="3">Filmes</td>
                </tr>
            </th>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="3" class="col-bolder">Mulher</th>
                <td>Isabela</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
            <tr>
                <td>Thereza</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>Batman</td>
            </tr>
                <tr>
                    <td>Solange</td>
                    <td>Oblivion</td>
                    <td>Matrix</td>
                    <td>Big Hero</td>
                </tr>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="3" class="col-bolder">Homem</th>
                <td>Pedro</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>
                <tr>
                    <td>Adilson</td>
                    <td>Wall-e</td>
                    <td>Oldboy</td>
                    <td>Dangal</td>
                </tr>
                <tr>
                    <td>Arthur</td>
                    <td>Star Wars</td>
                    <td>Taxi Driver</td>
                    <td>Toy Story</td>
                </tr>
            </tr>
        </tbody>
    </table>
</body>
</html>
