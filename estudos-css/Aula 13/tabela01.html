<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            border: 2px solid red;
        }
        tr.linha-1 {
            background-color: lightgray;
        }
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center; /* Alinhamento Horizontal*/
            vertical-align: top; /* Alinhamento Vertical*/ /* Top, Middle e Bottom*/
        }
        .dado {
            background-color: aqua;
        }

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!-- Hierarquia de Tabelas 
        TABLE - TABELAS - <table>
            TABLE ROWS - LINHA DE TABELA - <tr>
                TABLE HEADER - CABEÇADO DE TABELA - <th>
                TABLE DATA - DADOS DA TABELA - <td>
    -->
    <table>
        <tr> <!-- Primeira Linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr> <!-- Segunda Linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr class="linha-1"> <!-- Terceira Linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr> <!-- Quarta Linha-->
            <td class="dado">A4</td>
            <td>B4</td>
            <td class="dado">C4</td>
        </tr>        
    </table>
</body>
</html>
