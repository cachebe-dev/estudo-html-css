<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 3</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        caption {
            padding-bottom: 20px;
            padding-top: 20px;
            font-weight: bold;
            font-size: 1.5em;
        }
        table {
            border-collapse: collapse;
            width: 500px;
        }

        td, th {
            border: 2px solid black;
            
        }
        thead, .medias, #media-1, #media-2 {
            background-color: gray;
            color: white;
            font-weight: bold;
        }
        .notas {
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <table>
        <caption>Notas dos Alunos</caption>
        <thead>
            <tr>
                <th scope="col" rowspan="2">Área</th>
                <th scope="col" rowspan="2" colspan="2">Disciplinas</th>
                <th scope="colgroup" colspan="2">Notas</th>
                <th scope="col" rowspan="2">Média</th>
                <tr>
                    <th scope="col">Nota 1</th>
                    <th scope="col">Nota 2</th>
                </tr>                
                
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4">Exatas</th>
                <td scope="row" colspan="2">Matemática</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
            </tr>
            <tr>
                <td scope="row" colspan="2">Física</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
            </tr>
            <tr>
                <td scope="row" colspan="2">Química</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
            </tr>
            <tr>
                <td scope="row" colspan="2">Biologia</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
            </tr>                        
            <tr>
                <td scope="row" colspan="5" class="medias">Média de Exatas</td>
                <td scope="row" class="notas" id="media-1">0.0</td>
            </tr>
            <tr>
                <th scope="rowgroup" rowspan="3">Humanas</th>
            </tr>
            <tr>
                <td scope="row" colspan="2">História</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>                
            </tr>
            <tr>
                <td scope="row" colspan="2">Geografia</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>
                <td scope="row" class="notas">0.0</td>                 
            </tr>
            <tr>
                <td scope="row" colspan="5" class="medias">Média de Humanas</td>
                <td scope="row" class="notas" id="media-2">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
