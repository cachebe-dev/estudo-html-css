<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Tela de Login</title>
</head>
<body>
    <main>
        <article>

            <div class="container">
                <div class="conteudo">
                    <h1>Login</h1>
                    <p>Seja bem-vindo(a) novamente, faça loguin para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                    <form action="cadastro.js" method="post" autocomplete="on">
                        <div>
                            <label for="iusuario"></label>
                            <input type="email" name="usuario" id="iusuario" required minlength="10" placeholder="Seu E-mail" autocomplete="email">
                        </div>
                        <div>
                            <label for="isenha"></label>
                            <input type="password" name="senha" id="isenha" required minlength="8" placeholder="Sua Senha" autocomplete="off">
                        </div>
                        <input id="entrar" type="submit" value="Entrar">
                        <button id="esqueci">Esqueci a Senha</button>
                    </form>
                </div>
            </div> 
        </article>
    </main>
</body>
</html>
