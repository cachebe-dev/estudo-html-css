<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
<h1>Inserindo vídeos hospedados localmente</h1>
<p>Este vídeos está sendo hospedado em seu próprio servidor.</p>
<video controls width="310" poster="media/capa.png">
    <source src="media/video-mp4.mp4" type="video/mp4">
    <source src="media/video-m4v.m4v" type="video/mp4">
    <source src="media/video-webm.webm" type="video/webm">
    <source src="media/video-ogv.ogv" type="video/ogg">
    <p> Seu navegador não tem compatibilidade com os formatos de vídeos disponíveis, <a href="media/video-mp4.mp4">clique aqui para baixar</a></p>
     
</video>
<h1>Inserindo vídeo do Youtube</h1>
<iframe 
width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=yvjMF1YnnfYxcNs_" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>   
</body>
</html>
