<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
<h1>Imagens Dinâmicas</h1>
<p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente ou diminua o zoom da página.</p>
<picture>
    <source media="(max-width: 750px )" srcset="imagens/pequena.png" type="image/png">
    <source media="(max-width: 1050px )" srcset="imagens/media.png" type="image/png">
    <img src="imagens/grande.png" alt="imagem flexível">
</picture>
<h1>Reproduzindo audios</h1>
<p>nessa sessão iremos aprender sobre reprodução de audios</p>

<audio preload="metadata" controls> 
    <source  src="media/shine.mp3" type="audio/mpeg">
    <source src="media/shine.ogg" type="audio/ogg">
    <source src="media/shine.wav" type="audio/wav"> <!-- atenção, é muito pesado-->
    <p> Caso o audio não carregue, <a href="media/shine.mp3">clique aqui</a></p>
</audio>
</body>
</html>
