<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
            ======== SELETORES PERSONALIZADOS ========
            #   = id
            .   = class
            :   = pseudo-class
            ::  = pseudo-element
            >   = children 
        */
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited {
            color: darkred;
        }
        a:hover {
            color: black;
            text-decoration: underline;
        }
        a:active {
            color: yellow;
        }
        a::after {
            content: '[ link ]';
            text-decoration: none;
            color: rgb(56, 56, 56);
            font-weight: normal;
        }
    </style>
</head>
<body>
<h1>Links Personalizados</h1>
<ul>
    <li><a href="github.com" target="_blank" rel="external">Github</a></li>
    <li><a href="youtube.com" target="_blank" rel="external">Youtube</a></li>
    <li><a href="instagram.com" target="_blank" rel="external">Instagram</a></li>
</ul>    
</body>
</html>
